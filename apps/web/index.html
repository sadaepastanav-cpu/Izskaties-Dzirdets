<!doctype html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121212" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <title>Event Studio</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #121212;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      .preloader-spinner {
        width: 44px;
        height: 44px;
        border: 4px solid rgba(255, 215, 0, 0.15);
        border-top: 4px solid #ffd700;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      .pulse-text {
        animation: pulse 1.5s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div
        id="loading-screen"
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100dvh;
          background: #121212;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 20px;
          box-sizing: border-box;
          text-align: center;
          z-index: 999999;
        "
      >
        <img
          id="event-loading-logo"
          src=""
          alt="Logo"
          style="
            display: none;
            max-height: 95px;
            max-width: 80%;
            object-fit: contain;
            margin-bottom: 24px;
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.6));
          "
        />
        <div class="preloader-spinner"></div>
        <div id="event-loading-title" style="font-size: 1.3rem; font-weight: 900; color: #ffd700; margin-bottom: 6px; letter-spacing: 1px;">
          EVENT STUDIO
        </div>
        <div class="pulse-text" style="font-size: 0.9rem; color: #888; font-weight: 500;">
          Ielādē spēli...
        </div>
      </div>
    </div>

    <script>
      (function() {
        try {
          var logoImg = document.getElementById('event-loading-logo');
          var titleEl = document.getElementById('event-loading-title');
          var screenEl = document.getElementById('loading-screen');

          var cached = localStorage.getItem('cached_branding');
          if (cached) {
            var br = JSON.parse(cached);
            if (br.appLogo && logoImg) {
              logoImg.src = '/project-media/' + encodeURIComponent(br.appLogo).replace(/%2F/g, '/');
              logoImg.style.display = 'block';
            }
            if (br.appTitle && titleEl) {
              titleEl.innerText = br.appTitle;
            }
            if (br.appBgColor && screenEl) {
              screenEl.style.backgroundColor = br.appBgColor;
            }
          }

          var urlParams = new URLSearchParams(window.location.search);
          var pin = urlParams.get('pin');
          if (pin) {
            fetch('/api/session-branding/' + pin)
              .then(function(r) { return r.json(); })
              .then(function(data) {
                if (data && data.branding) {
                  if (data.branding.appLogo && logoImg) {
                    logoImg.src = '/project-media/' + encodeURIComponent(data.branding.appLogo).replace(/%2F/g, '/');
                    logoImg.style.display = 'block';
                  }
                  if (data.branding.appTitle && titleEl) {
                    titleEl.innerText = data.branding.appTitle;
                  }
                  if (data.branding.appBgColor && screenEl) {
                    screenEl.style.backgroundColor = data.branding.appBgColor;
                  }
                }
              })
              .catch(function() {});
          }
        } catch(e) {}
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
